
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,'system-ui,sans-serif');background:var(--color-background-tertiary,#f5f5f2);color:var(--color-text-primary,#1a1a18);min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{padding:1.25rem 1rem 0;text-align:center}
.header h1{font-size:18px;font-weight:500}
.header p{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.tabs{display:flex;gap:0;margin:1rem 1rem 0;background:var(--color-background-secondary,#eae8e0);border-radius:var(--border-radius-lg,12px);padding:3px}
.tab{flex:1;padding:9px 8px;border:none;background:transparent;border-radius:10px;font-size:13px;font-weight:500;color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s}
.tab.active{background:var(--color-background-primary,#fff);color:var(--color-text-primary);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.content{flex:1;padding:1rem;overflow-y:auto}
.form-card{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg,12px);padding:1.25rem;margin-bottom:1rem}
.form-card h2{font-size:14px;font-weight:500;color:var(--color-text-secondary);margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.field{margin-bottom:1rem}
.field label{display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:5px;font-weight:500}
.field select,.field input{width:100%;padding:9px 12px;border:0.5px solid var(--color-border-secondary,rgba(0,0,0,.3));border-radius:var(--border-radius-md,8px);font-size:14px;background:var(--color-background-primary,#fff);color:var(--color-text-primary)}
.field select:focus,.field input:focus{outline:none;box-shadow:0 0 0 2px #185FA5}
.motivo-group{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.motivo-btn{padding:10px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md,8px);background:var(--color-background-primary,#fff);color:var(--color-text-secondary);font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.motivo-btn.selected.cobro{background:#E1F5EE;border-color:#0F6E56;color:#085041}
.motivo-btn.selected.venta{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.loc-btn{width:100%;padding:10px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md,8px);background:var(--color-background-primary,#fff);color:var(--color-text-secondary);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.loc-btn.got{border-color:#0F6E56;color:#085041;background:#E1F5EE}
.loc-btn.error{border-color:#993C1D;color:#712B13;background:#FAECE7}
.loc-text{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.submit-btn{width:100%;padding:13px;border:none;border-radius:var(--border-radius-md,8px);background:#185FA5;color:#fff;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.submit-btn:not(:disabled):hover{opacity:.9}
.toast{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1D9E75;color:#fff;padding:10px 20px;border-radius:var(--border-radius-md);font-size:14px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
.toast.error-toast{background:#D85A30}
.lock-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;min-height:300px;gap:1rem}
.lock-screen .lock-icon{font-size:48px;color:var(--color-text-secondary)}
.lock-screen h3{font-size:16px;font-weight:500}
.lock-screen p{font-size:13px;color:var(--color-text-secondary);text-align:center}
.lock-input-wrap{display:flex;gap:8px;width:100%;max-width:280px}
.lock-input-wrap input{flex:1;padding:10px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:16px;background:var(--color-background-primary);color:var(--color-text-primary);letter-spacing:4px;text-align:center}
.lock-input-wrap input.err{border-color:#E24B4A;background:#FCEBEB}
.lock-input-wrap button{padding:10px 16px;border:none;border-radius:var(--border-radius-md);background:#185FA5;color:#fff;font-size:14px;font-weight:500;cursor:pointer}
.filter-card{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg,12px);padding:1rem;margin-bottom:1rem}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.filter-field label{font-size:11px;color:var(--color-text-secondary);margin-bottom:3px;display:block;font-weight:500}
.filter-field input,.filter-field select{width:100%;padding:7px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;background:var(--color-background-primary);color:var(--color-text-primary)}
.filter-actions{display:flex;gap:8px;margin-top:8px}
.btn-action{flex:1;padding:9px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-primary);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-action.blue{border-color:#185FA5;color:#185FA5}
.btn-action.blue:hover{background:#E6F1FB}
.btn-action.green{border-color:#0F6E56;color:#085041}
.btn-action.green:hover{background:#E1F5EE}
.btn-action.red{border-color:#A32D2D;color:#A32D2D}
.btn-action.red:hover{background:#FCEBEB}
.record-card{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg,12px);padding:1rem;margin-bottom:.75rem;display:flex;gap:10px;align-items:flex-start}
.record-avatar{width:38px;height:38px;border-radius:50%;background:#B5D4F4;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#0C447C;flex-shrink:0}
.record-body{flex:1;min-width:0}
.record-name{font-size:14px;font-weight:500;margin-bottom:2px}
.record-meta{font-size:12px;color:var(--color-text-secondary);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge.cobro{background:#E1F5EE;color:#085041}
.badge.venta{background:#E6F1FB;color:#0C447C}
.badge.km{background:#F1EFE8;color:#444441}
.record-loc{font-size:11px;color:var(--color-text-secondary);margin-top:4px;display:flex;align-items:center;gap:4px}
.record-actions{display:flex;flex-direction:column;gap:6px}
.icon-btn{padding:5px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-secondary);cursor:pointer;font-size:16px;display:flex;align-items:center}
.icon-btn:hover.map{background:#E1F5EE;color:#0F6E56;border-color:#0F6E56}
.icon-btn:hover.del{background:#FCEBEB;color:#A32D2D;border-color:#E24B4A}
.empty{text-align:center;padding:3rem 1rem;color:var(--color-text-secondary)}
.empty i{font-size:40px;margin-bottom:.75rem;display:block}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.stat{background:var(--color-background-secondary,#eae8e0);border-radius:var(--border-radius-md,8px);padding:.75rem 1rem}
.stat .val{font-size:22px;font-weight:500}
.stat .lbl{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.admin-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.admin-top h2{font-size:16px;font-weight:500}
</style>

<div class="app">
  <div class="header">
    <h1><i class="ti ti-map-pin" style="vertical-align:-2px"></i> Registro de visitas</h1>
    <p>Control de asesores en campo</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('asesor')" id="tab-asesor">
      <i class="ti ti-user" style="font-size:15px"></i> Asesor
    </button>
    <button class="tab" onclick="showTab('admin')" id="tab-admin">
      <i class="ti ti-shield" style="font-size:15px"></i> Admin
    </button>
  </div>

  <div class="content" id="content-asesor">
    <div class="form-card">
      <h2><i class="ti ti-user-circle" style="font-size:16px"></i> Datos del asesor</h2>
      <div class="field">
        <label>Asesor</label>
        <select id="asesor" onchange="checkReady()">
          <option value="">— Selecciona tu nombre —</option>
          <option>JOSUE PINEDA</option><option>MOISES MOLINA</option><option>CARLOS HERRERA</option>
          <option>DANIEL ESPAÑA</option><option>FERNANDO MEZA</option><option>CRISTIAN SALAZAR</option>
          <option>CRISTINA CIFUENTES</option><option>DIEGO ACHACHI</option><option>PABLO PERALTA</option>
          <option>SEBASTIAN VANEGAS</option><option>EDISON MAYORGA</option><option>EDUARDO PICO</option>
          <option>CARLOS GRANJA</option>
        </select>
      </div>
      <div class="field">
        <label>Kilometraje del vehículo</label>
        <input type="number" id="km" placeholder="Ej: 45230" min="0" oninput="checkReady()">
      </div>
      <div class="field">
        <label>Motivo de visita</label>
        <div class="motivo-group">
          <button class="motivo-btn" id="btn-cobro" onclick="selectMotivo('cobro')">
            <i class="ti ti-cash" style="font-size:16px"></i> Cobro
          </button>
          <button class="motivo-btn" id="btn-venta" onclick="selectMotivo('venta')">
            <i class="ti ti-tag" style="font-size:16px"></i> Venta
          </button>
        </div>
      </div>
    </div>
    <div class="form-card">
      <h2><i class="ti ti-map-pin" style="font-size:16px"></i> Ubicación GPS</h2>
      <div class="field">
        <button class="loc-btn" id="loc-btn" onclick="getLocation()">
          <i class="ti ti-current-location" style="font-size:18px" id="loc-icon"></i>
          <span class="loc-text" id="loc-text">Toca para obtener tu ubicación actual</span>
        </button>
      </div>
      <div id="map-container" style="border-radius:var(--border-radius-md);overflow:hidden;height:160px;display:none;border:0.5px solid var(--color-border-secondary)">
        <iframe id="map-frame" style="width:100%;height:100%;border:none" allowfullscreen></iframe>
      </div>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="submitForm()" disabled>
      <i class="ti ti-circle-check" style="font-size:18px"></i> Registrar visita
    </button>
  </div>

  <div class="content" id="content-admin" style="display:none">
    <div id="lock-wrap">
      <div class="lock-screen">
        <i class="ti ti-lock lock-icon"></i>
        <h3>Acceso administrador</h3>
        <p>Ingresa el código para ver los registros</p>
        <div class="lock-input-wrap">
          <input type="password" id="pin-input" placeholder="••••" maxlength="4" onkeydown="if(event.key==='Enter')checkPin()">
          <button onclick="checkPin()">Entrar</button>
        </div>
        <p id="pin-error" style="color:#A32D2D;font-size:12px;display:none">Código incorrecto</p>
      </div>
    </div>
    <div id="admin-panel" style="display:none">
      <div class="admin-top">
        <h2><i class="ti ti-clipboard-list" style="font-size:16px;vertical-align:-2px"></i> Registros</h2>
        <button class="btn-action red" onclick="lockAdmin()" style="flex:0;padding:6px 10px;font-size:12px">
          <i class="ti ti-lock" style="font-size:14px"></i> Cerrar
        </button>
      </div>
      <div class="filter-card">
        <div class="filter-row">
          <div class="filter-field"><label>Desde</label><input type="date" id="f-desde"></div>
          <div class="filter-field"><label>Hasta</label><input type="date" id="f-hasta"></div>
        </div>
        <div class="filter-row">
          <div class="filter-field">
            <label>Asesor</label>
            <select id="f-asesor">
              <option value="">Todos</option>
              <option>JOSUE PINEDA</option><option>MOISES MOLINA</option><option>CARLOS HERRERA</option>
              <option>DANIEL ESPAÑA</option><option>FERNANDO MEZA</option><option>CRISTIAN SALAZAR</option>
              <option>CRISTINA CIFUENTES</option><option>DIEGO ACHACHI</option><option>PABLO PERALTA</option>
              <option>SEBASTIAN VANEGAS</option><option>EDISON MAYORGA</option><option>EDUARDO PICO</option>
              <option>CARLOS GRANJA</option>
            </select>
          </div>
          <div class="filter-field">
            <label>Motivo</label>
            <select id="f-motivo">
              <option value="">Todos</option>
              <option value="cobro">Cobro</option>
              <option value="venta">Venta</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn-action blue" onclick="renderAdmin()"><i class="ti ti-filter" style="font-size:14px"></i> Filtrar</button>
          <button class="btn-action green" onclick="exportExcel()"><i class="ti ti-file-spreadsheet" style="font-size:14px"></i> Excel</button>
        </div>
      </div>
      <div id="stats-row" class="stats-row"></div>
      <div id="admin-records"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" style="position:fixed"></div>

<script>
const ADMIN_PIN = '2025';
let selectedMotivo = '';
let locationData = null;
let allRecords = [];

async function loadRecords() {
  try {
    const r = await window.storage.get('visitas_records');
    allRecords = r ? JSON.parse(r.value) : [];
  } catch(e) { allRecords = []; }
}

async function saveRecords() {
  await window.storage.set('visitas_records', JSON.stringify(allRecords));
}

function showTab(tab) {
  document.getElementById('content-asesor').style.display = tab==='asesor'?'block':'none';
  document.getElementById('content-admin').style.display = tab==='admin'?'block':'none';
  document.getElementById('tab-asesor').className='tab'+(tab==='asesor'?' active':'');
  document.getElementById('tab-admin').className='tab'+(tab==='admin'?' active':'');
}

function checkPin() {
  const val = document.getElementById('pin-input').value;
  const err = document.getElementById('pin-error');
  if(val === ADMIN_PIN) {
    document.getElementById('lock-wrap').style.display='none';
    document.getElementById('admin-panel').style.display='block';
    renderAdmin();
    err.style.display='none';
    document.getElementById('pin-input').value='';
  } else {
    document.getElementById('pin-input').className='err';
    err.style.display='block';
    setTimeout(()=>{
      document.getElementById('pin-input').className='';
      document.getElementById('pin-input').value='';
    },1200);
  }
}

function lockAdmin() {
  document.getElementById('lock-wrap').style.display='block';
  document.getElementById('admin-panel').style.display='none';
}

function selectMotivo(m) {
  selectedMotivo = m;
  document.getElementById('btn-cobro').className='motivo-btn'+(m==='cobro'?' selected cobro':'');
  document.getElementById('btn-venta').className='motivo-btn'+(m==='venta'?' selected venta':'');
  checkReady();
}

function getLocation() {
  const btn=document.getElementById('loc-btn');
  const txt=document.getElementById('loc-text');
  const icon=document.getElementById('loc-icon');
  txt.textContent='Obteniendo ubicación...';
  icon.className='ti ti-loader-2';
  btn.disabled=true;
  if(!navigator.geolocation){txt.textContent='GPS no disponible';btn.className='loc-btn error';btn.disabled=false;return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude.toFixed(6);
    const lng=pos.coords.longitude.toFixed(6);
    locationData={lat,lng,acc:Math.round(pos.coords.accuracy)};
    txt.textContent=lat+', '+lng+' (±'+locationData.acc+'m)';
    btn.className='loc-btn got';
    icon.className='ti ti-circle-check';
    btn.disabled=false;
    const mc=document.getElementById('map-container');
    mc.style.display='block';
    document.getElementById('map-frame').src='https://maps.google.com/maps?q='+lat+','+lng+'&z=16&output=embed';
    checkReady();
  },()=>{
    txt.textContent='No se pudo obtener ubicación. Verifica permisos GPS.';
    btn.className='loc-btn error';
    icon.className='ti ti-map-pin-off';
    btn.disabled=false;
  },{enableHighAccuracy:true,timeout:15000});
}

function checkReady() {
  const ok=document.getElementById('asesor').value&&document.getElementById('km').value&&selectedMotivo&&locationData;
  document.getElementById('submit-btn').disabled=!ok;
}

async function submitForm() {
  const asesor=document.getElementById('asesor').value;
  const km=document.getElementById('km').value;
  if(!asesor||!km||!selectedMotivo||!locationData)return;
  const now=new Date();
  allRecords.unshift({id:Date.now(),asesor,km:parseInt(km),motivo:selectedMotivo,lat:locationData.lat,lng:locationData.lng,acc:locationData.acc,fecha:now.toISOString().split('T')[0],hora:now.toTimeString().slice(0,5),ts:now.toISOString()});
  await saveRecords();
  showToast('✓ Visita registrada correctamente',false);
  document.getElementById('asesor').value='';
  document.getElementById('km').value='';
  selectedMotivo='';locationData=null;
  document.getElementById('btn-cobro').className='motivo-btn';
  document.getElementById('btn-venta').className='motivo-btn';
  document.getElementById('loc-btn').className='loc-btn';
  document.getElementById('loc-icon').className='ti ti-current-location';
  document.getElementById('loc-text').textContent='Toca para obtener tu ubicación actual';
  document.getElementById('map-container').style.display='none';
  document.getElementById('submit-btn').disabled=true;
}

function getFiltered() {
  const desde=document.getElementById('f-desde').value;
  const hasta=document.getElementById('f-hasta').value;
  const asesor=document.getElementById('f-asesor').value;
  const motivo=document.getElementById('f-motivo').value;
  return allRecords.filter(r=>{
    if(desde&&r.fecha<desde)return false;
    if(hasta&&r.fecha>hasta)return false;
    if(asesor&&r.asesor!==asesor)return false;
    if(motivo&&r.motivo!==motivo)return false;
    return true;
  });
}

function renderAdmin() {
  const fr=getFiltered();
  const cobros=fr.filter(r=>r.motivo==='cobro').length;
  const ventas=fr.filter(r=>r.motivo==='venta').length;
  document.getElementById('stats-row').innerHTML=
    '<div class="stat"><div class="val">'+fr.length+'</div><div class="lbl">Total registros</div></div>'+
    '<div class="stat"><div class="val">'+cobros+' / '+ventas+'</div><div class="lbl">Cobros / Ventas</div></div>';
  const c=document.getElementById('admin-records');
  if(!fr.length){c.innerHTML='<div class="empty"><i class="ti ti-clipboard-x"></i><p>No hay registros</p></div>';return;}
  c.innerHTML=fr.map(r=>{
    const ini=r.asesor.split(' ').map(w=>w[0]).join('').slice(0,2);
    return '<div class="record-card">'+
      '<div class="record-avatar">'+ini+'</div>'+
      '<div class="record-body">'+
        '<div class="record-name">'+r.asesor+'</div>'+
        '<div class="record-meta">'+
          '<span class="badge '+r.motivo+'">'+r.motivo.toUpperCase()+'</span>'+
          '<span class="badge km"><i class="ti ti-car" style="font-size:11px"></i> '+r.km.toLocaleString()+' km</span>'+
          '<span style="font-size:11px;color:var(--color-text-secondary)">'+r.fecha+' '+r.hora+'</span>'+
        '</div>'+
        '<div class="record-loc"><i class="ti ti-map-pin" style="font-size:12px"></i> '+r.lat+', '+r.lng+'</div>'+
      '</div>'+
      '<div class="record-actions">'+
        '<button class="icon-btn map" onclick="openMap(\''+r.lat+'\',\''+r.lng+'\')" title="Ver en Maps"><i class="ti ti-map-2" aria-hidden="true"></i></button>'+
        '<button class="icon-btn del" onclick="deleteRecord('+r.id+')" title="Eliminar"><i class="ti ti-trash" aria-hidden="true"></i></button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function openMap(lat,lng){const u='https://maps.google.com/maps?q='+lat+','+lng;if(typeof openLink==='function')openLink(u);else window.open(u,'_blank');}

async function deleteRecord(id){
  allRecords=allRecords.filter(r=>r.id!==id);
  await saveRecords();
  renderAdmin();
  showToast('Registro eliminado',false);
}

function exportExcel(){
  const fr=getFiltered();
  if(!fr.length){showToast('No hay registros para exportar',true);return;}
  const desde=document.getElementById('f-desde').value||'inicio';
  const hasta=document.getElementById('f-hasta').value||'hoy';
  const data=fr.map(r=>({'Asesor':r.asesor,'Fecha':r.fecha,'Hora':r.hora,'Motivo':r.motivo.charAt(0).toUpperCase()+r.motivo.slice(1),'Kilometraje':r.km,'Latitud':r.lat,'Longitud':r.lng,'Precisión GPS (m)':r.acc,'Google Maps':'https://maps.google.com/?q='+r.lat+','+r.lng}));
  const ws=XLSX.utils.json_to_sheet(data);
  ws['!cols']=[{wch:22},{wch:12},{wch:8},{wch:10},{wch:14},{wch:14},{wch:14},{wch:18},{wch:40}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Visitas');
  XLSX.writeFile(wb,'Visitas_'+desde+'_a_'+hasta+'.xlsx');
  showToast('Excel descargado',false);
}

function showToast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(isErr?' error-toast':'')+' show';
  setTimeout(()=>{t.className='toast'+(isErr?' error-toast':'');},2800);
}

loadRecords();
</script>
